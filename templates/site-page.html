<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}} | {{PROJECT_NAME}}</title>
<meta name="description" content="{{PAGE_DESCRIPTION}}">
<!--
  Self-contained on purpose. No stylesheet, no font, no script from anywhere
  else, so this page works from a folder on a desktop, from inside a zip, and
  behind a proxy that blocks everything.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --rule: #e2e2e2;
    --link: #0b5cad;
    --code-bg: #f5f5f4;
    --sidebar: #fafaf9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --fg: #e8e8e6;
      --muted: #a0a0a0;
      --rule: #303236;
      --link: #7ab6f0;
      --code-bg: #1f2124;
      --sidebar: #1b1c1f;
    }
  }
  * { box-sizing: border-box; }
  .skip {
    position: absolute;
    left: -9999px;
    top: 0;
    background: var(--bg);
    color: var(--link);
    padding: 0.6rem 1rem;
    border: 2px solid var(--link);
    z-index: 10;
  }
  .skip:focus { left: 0; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .layout { display: flex; min-height: 100vh; align-items: stretch; }
  nav {
    flex: 0 0 240px;
    background: var(--sidebar);
    border-right: 1px solid var(--rule);
    padding: 2rem 1.25rem;
  }
  .nav-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 0.75rem;
    font-weight: 600;
  }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav li { margin: 0 0 0.35rem; }
  nav a { color: var(--fg); text-decoration: none; display: block; padding: 0.25rem 0; }
  nav a:hover { text-decoration: underline; }
  nav a[aria-current="page"] { font-weight: 600; color: var(--link); }
  main { flex: 1 1 auto; min-width: 0; padding: 2.5rem 2rem 4rem; }
  .measure { max-width: 70ch; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 1.25rem; }
  h2 { font-size: 1.35rem; margin: 2.25rem 0 0.75rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--rule); }
  h3 { font-size: 1.1rem; margin: 1.75rem 0 0.5rem; }
  a { color: var(--link); }
  code {
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 3px;
    font: 0.875em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  pre {
    background: var(--code-bg);
    padding: 1rem;
    border-radius: 6px;
    overflow-x: auto;
    max-width: 100%;
  }
  pre code { background: none; padding: 0; }
  .table-wrap { overflow-x: auto; max-width: 100%; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  blockquote {
    margin: 1.25rem 0;
    padding: 0.25rem 0 0.25rem 1rem;
    border-left: 3px solid var(--rule);
    color: var(--muted);
  }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.85rem; }
  @media (max-width: 720px) {
    .layout { flex-direction: column; }
    nav { flex: none; border-right: 0; border-bottom: 1px solid var(--rule); padding: 1.25rem; }
    main { padding: 1.5rem 1.25rem 3rem; }
  }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div class="layout">
  <nav aria-label="Documentation">
    <p class="nav-title">{{PROJECT_NAME}}</p>
    <ul>
      {{NAV_ITEMS}}
    </ul>
  </nav>
  <main id="content">
    <div class="measure">
      {{CONTENT}}
      <footer>Generated {{GENERATED_DATE}}</footer>
    </div>
  </main>
</div>
</body>
</html>
