# client-docs manifest.
#
# Two jobs. It records what is documented and how current each file is, and its
# existence is what activates the plugin in this repository. Delete it and every
# command except /docs-init goes quiet.
#
# Never put a secret value in here.

generated_by_version: 1.0.0

project:
  name: {{PROJECT_NAME}}
  description: {{ONE_LINE}}

# Hand-edited. /docs-site reads this before it tries to detect anything, so
# filling it in is how you stop the guessing and pin the documentation site's
# look. Every key is optional; an empty or missing key falls back to detection.
branding:
  # Any CSS colour. Used for links, the active sidebar item and focus rings.
  # Contrast against the dark theme is checked and the colour is lightened for
  # dark mode if it fails, so a dark brand navy is a fine thing to put here.
  primary: null
  # Used for the quieter surfaces: table header rows, blockquote bars, the
  # sidebar's active background, code block borders. Leave null to derive a
  # muted tint of the primary instead.
  secondary: null
  # Path, relative to the repository root, to the image shown beside the title.
  # Prefer a square image: it is drawn at about 24px tall.
  logo: null
  # Optional. Overrides the site title, which otherwise comes from project.name.
  title: null

stack:
  languages: []
  frameworks: []
  cms: null
  frontend: []
  backend: []
  database: null

development:
  package_manager: []
  local_environment: null

deployment:
  platform: null
  ci_cd: none detected

# Whether exported configuration can be trusted. See the project-analysis skill.
config_assessment:
  directory: null
  status: absent          # current | stale | absent
  note: ""

integrations: []
# - name: Adobe Fonts
#   purpose: web fonts
#   evidence: [path/to/file]

documentation:
  files: []
  # - path: docs/ARCHITECTURE.md
  #   last_verified_commit: {{SHA}}
  #   last_audited: {{DATE}}
  #   status: current     # current | stale | unverified

  manually_verified: []
  # - question: Which environment is production?
  #   answer: ...
  #   date: {{DATE}}

  requires_confirmation: []
  # - id: dns
  #   question: Who controls DNS for the production domain?
  #   affects: docs/CLIENT-HANDOFF.md
  #   known: what the repository already shows

# Which files support each handoff section. Internal only: never rendered into
# the client document. This is what makes a repeat handoff fast.
handoff_evidence: {}

last_handoff: null
#   date: {{DATE}}
#   commit: {{SHA}}
